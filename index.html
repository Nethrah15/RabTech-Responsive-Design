<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - RABTECH Task 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>💰 Expense Tracker</h1>
    <button id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <main class="dashboard">
    <section class="card glass">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <input type="text" id="title" placeholder="Title - e.g. Lunch" required>
        <input type="text" id="category" placeholder="Category - e.g. Food" required>
        <input type="number" id="amount" placeholder="Amount" required>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="card glass stats">
      <h2>Total Spent</h2>
      <h3 id="total">₹0</h3>
      <p id="loading" style="display:none;">Loading...</p>
      <p id="error" style="display:none; color:red;"></p>
    </section>

    <section class="card glass list-card">
      <h2>Your Expenses</h2>
      <ul id="expenseList"></ul>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    function toggleTheme(){
      document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent = 
        document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode";
    }
  </script>
</body>
</html>
